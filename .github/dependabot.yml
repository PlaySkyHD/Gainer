version: 2
updates:
  - package-ecosystem: docker
    directories: [/deploy]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    # Ein .NET-Major in den Images braucht den Umstieg von TargetFramework
    # und global.json; das ist ein eigener PR, kein Image-Update.
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Aspire-Pakete müssen dieselbe Version haben, auch bei Major-Updates.
      aspire:
        patterns: ["Aspire.*"]
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
    # Npgsql-Major nur zusammen mit Npgsql.EntityFrameworkCore.PostgreSQL,
    # dessen nächster Major an EF Core und .NET 11 hängt.
    ignore:
      - dependency-name: "Npgsql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]
        update-types: [minor, patch]
