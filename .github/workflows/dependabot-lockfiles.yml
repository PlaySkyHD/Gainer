name: Dependabot lock files

# Dependabot updates packages.lock.json only in projects that reference the bumped package
# directly. Projects that get it transitively (Migrator, tests) keep stale lock files and CI
# fails. This workflow regenerates all lock files on Dependabot's NuGet PRs and pushes them.
#
# It pushes with a token of the repo's GitHub App (Contents: read and write): client ID in the
# variable DEPENDABOT_CLIENT_ID, private key in the *Dependabot* secret DEPENDABOT_PRIVATE_KEY
# (workflows triggered by Dependabot cannot read Actions secrets). A push with GITHUB_TOKEN would
# not start CI and Sonar again. The push comes from the app, so the follow-up run does not match
# the condition below.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfiles-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate lock files
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require app credentials
        env:
          CLIENT_ID: ${{ vars.DEPENDABOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.DEPENDABOT_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo '::error::Variable DEPENDABOT_CLIENT_ID or Dependabot secret DEPENDABOT_PRIVATE_KEY is missing; see the header of this workflow.'
            exit 1
          fi

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DEPENDABOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 17.0.0

      - name: Regenerate lock files
        run: dotnet restore Gainer.slnx --force-evaluate

      - name: Commit and push changed lock files
        run: |
          if [ -z "$(git status --porcelain -- '**/packages.lock.json')" ]; then
            echo 'Lock files are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '**/packages.lock.json'
          git commit -m 'build(deps): Lock-Dateien nach Dependabot-Update aktualisiert'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
