name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: Build and attach a signed IPA without uploading to Apple
        type: boolean
        required: true
        default: false
      upload_testflight:
        description: Build and upload the signed IPA to App Store Connect for TestFlight processing
        type: boolean
        required: true
        default: false
      build_number:
        description: Optional CFBundleVersion override (1-3 numeric components; use when this app has a higher existing build)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.build_signed_ipa || inputs.upload_testflight) && 'signed' || 'verify' }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Stable Flutter checks and iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select and verify pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("apps/mobile/tool/toolchain.json"))["xcode"]["version"])')"
          developer_dir="/Applications/Xcode_${expected}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::Pinned Xcode $expected was not found at $developer_dir"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          actual="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected Xcode $expected, found $actual"
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Restore Flutter SDK archive cache
        id: flutter-sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flutter-downloads/flutter_macos_3.47.7-stable.zip
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ hashFiles('apps/mobile/tool/toolchain.json') }}

      - name: Install verified Flutter stable SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/flutter-sdk"
          download_root="$RUNNER_TEMP/flutter-downloads"
          archive="$download_root/flutter_macos_3.47.7-stable.zip"
          expected_sha256='17d39b000a5d0681e3f7b61a105a36f6f31dd41ab9073f625fd466f38035f901'
          mkdir -p "$download_root"
          if [[ -f "$archive" ]] && printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 --check --status; then
            echo 'Cached Flutter SDK archive passed SHA-256 verification.'
          else
            echo 'Flutter SDK archive cache is missing or invalid; downloading the pinned release.'
            rm -f "$archive"
            curl --fail --location --retry 3 \
              'https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.47.7-stable.zip' \
              --output "$archive"
          fi
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 --check
          rm -rf "$sdk_root/flutter"
          mkdir -p "$sdk_root"
          unzip -q "$archive" -d "$sdk_root"
          echo "$sdk_root/flutter/bin" >> "$GITHUB_PATH"
          "$sdk_root/flutter/bin/flutter" --version --machine
          "$sdk_root/flutter/bin/flutter" doctor --version

      - name: Save Flutter SDK archive cache
        if: ${{ success() && steps.flutter-sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flutter-downloads/flutter_macos_3.47.7-stable.zip
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ hashFiles('apps/mobile/tool/toolchain.json') }}

      - name: Restore Dart package cache
        id: dart-pub-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev
            ~/.pub-cache/hosted-hashes/pub.dev
          key: ${{ runner.os }}-${{ runner.arch }}-dart-pub-${{ hashFiles('apps/mobile/tool/toolchain.json', 'apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}

      - name: Verify mobile package and build iOS Simulator app
        shell: pwsh
        env:
          GAINER_FLUTTER_SDK_ROOT: ${{ runner.temp }}/flutter-sdk/flutter
        run: ./scripts/Verify-Mobile.ps1 -BuildIosSimulator

      - name: Save Dart package cache
        if: ${{ success() && steps.dart-pub-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev
            ~/.pub-cache/hosted-hashes/pub.dev
          key: ${{ runner.os }}-${{ runner.arch }}-dart-pub-${{ hashFiles('apps/mobile/tool/toolchain.json', 'apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}

      - name: Upload shell preview for visual review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-shell-preview
          path: artifacts/mobile-preview/mobile-shell-390x844.png
          if-no-files-found: error
          retention-days: 7

  signed-ipa:
    name: Manually requested signed IPA / TestFlight upload
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_signed_ipa || inputs.upload_testflight) && github.ref == 'refs/heads/main' }}
    needs: ios-simulator
    runs-on: macos-15
    timeout-minutes: 60
    environment: ios-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require main branch code before accessing signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Signed IPA generation is only allowed from main.'
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo '::error::The workflow commit is not reachable from origin/main.'
            exit 1
          fi

      - name: Require signing configuration
        id: build-version
        shell: bash
        env:
          GAINER_API_ORIGIN: ${{ vars.GAINER_API_ORIGIN || 'https://gainer.markfort.xyz' }}
          GAINER_TRUSTED_FRONTEND_ORIGIN: ${{ vars.GAINER_TRUSTED_FRONTEND_ORIGIN || 'https://gainer.markfort.xyz' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
          IOS_APP_GROUP_ID: ${{ vars.IOS_APP_GROUP_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID IOS_WIDGET_BUNDLE_ID IOS_APP_GROUP_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required environment variable $name is not configured for the ios-beta environment."
              exit 1
            fi
          done
          for name in IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_WIDGET_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is not configured for the ios-beta environment."
              exit 1
            fi
          done
          for name in GAINER_API_ORIGIN GAINER_TRUSTED_FRONTEND_ORIGIN; do
            value="${!name}"
            if ! python3 -c 'import sys,urllib.parse; u=urllib.parse.urlsplit(sys.argv[1]); sys.exit(0 if u.scheme == "https" and u.hostname and not u.username and not u.password and u.path in ("", "/") and not u.query and not u.fragment else 1)' "$value"; then
              echo "::error::$name must be an HTTPS origin without credentials, path, query, or fragment."
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::APPLE_TEAM_ID must be the 10-character Apple Developer Team ID.'
            exit 1
          fi
          [[ "$IOS_WIDGET_BUNDLE_ID" == "${IOS_BUNDLE_ID}.Widgets" ]] || { echo '::error::IOS_WIDGET_BUNDLE_ID must be the app bundle ID plus .Widgets.'; exit 1; }
          [[ "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9]+([.-][A-Za-z0-9]+)+$ ]] || { echo '::error::IOS_BUNDLE_ID must contain only valid bundle identifier components.'; exit 1; }
          [[ "$IOS_APP_GROUP_ID" =~ ^group\.[A-Za-z0-9]+([.-][A-Za-z0-9]+)*$ ]] || { echo '::error::IOS_APP_GROUP_ID must be a valid group.<identifier> value.'; exit 1; }

          marketing_version="$(python3 -c 'import re; s=open("apps/mobile/pubspec.yaml", encoding="utf-8").read(); m=re.search(r"(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$", s); print(m.group(1) if m else "")')"
          if [[ -z "$marketing_version" ]]; then
            echo '::error::Could not read a numeric marketing version from apps/mobile/pubspec.yaml.'
            exit 1
          fi
          candidate="${BUILD_NUMBER_OVERRIDE:-}"
          if [[ -z "$candidate" ]]; then
            candidate="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          if ! python3 - "$candidate" <<'PY'
          import re, sys
          value = sys.argv[1]
          if not re.fullmatch(r"[1-9][0-9]{0,3}(?:\.(?:0|[1-9][0-9]?)){0,2}", value):
              raise SystemExit(1)
          PY
          then
            echo '::error::CFBundleVersion is invalid. Set build_number to a canonical value with a major component 1-9999 and up to two minor/patch components 0-99; the automatic value is run_number.run_attempt.'
            exit 1
          fi
          {
            echo "marketing_version=$marketing_version"
            echo "build_number=$candidate"
          } >> "$GITHUB_OUTPUT"

      - name: Require App Store Connect API key for requested TestFlight upload
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ inputs.upload_testflight && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is not configured in ios-beta for the requested TestFlight upload."
              exit 1
            fi
          done
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::APP_STORE_CONNECT_KEY_ID must contain 10 uppercase letters or digits.'; exit 1; }
          [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]] || { echo '::error::APP_STORE_CONNECT_ISSUER_ID must be a UUID.'; exit 1; }
          if [[ "$APP_STORE_CONNECT_PRIVATE_KEY" != *'-----BEGIN PRIVATE KEY-----'* || "$APP_STORE_CONNECT_PRIVATE_KEY" != *'-----END PRIVATE KEY-----'* ]]; then
            echo '::error::APP_STORE_CONNECT_PRIVATE_KEY must be the raw PEM contents of the downloaded .p8 key.'
            exit 1
          fi

      - name: Select and verify pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("apps/mobile/tool/toolchain.json"))["xcode"]["version"])')"
          developer_dir="/Applications/Xcode_${expected}.app/Contents/Developer"
          test -d "$developer_dir" || { echo "::error::Pinned Xcode $expected is unavailable."; exit 1; }
          sudo xcode-select --switch "$developer_dir"
          actual="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          [[ "$actual" == "$expected" ]] || { echo "::error::Expected Xcode $expected, found $actual"; exit 1; }
          xcodebuild -version

      - name: Restore Flutter SDK archive cache
        id: flutter-sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flutter-downloads/flutter_macos_3.47.7-stable.zip
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-sdk-${{ hashFiles('apps/mobile/tool/toolchain.json') }}

      - name: Install verified Flutter stable SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/flutter-sdk"
          download_root="$RUNNER_TEMP/flutter-downloads"
          archive="$download_root/flutter_macos_3.47.7-stable.zip"
          expected_sha256='17d39b000a5d0681e3f7b61a105a36f6f31dd41ab9073f625fd466f38035f901'
          mkdir -p "$download_root"
          if [[ -f "$archive" ]] && printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 --check --status; then
            echo 'Cached Flutter SDK archive passed SHA-256 verification.'
          else
            echo 'Flutter SDK archive cache is missing or invalid; downloading the pinned release.'
            rm -f "$archive"
            curl --fail --location --retry 3 \
              'https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_3.47.7-stable.zip' \
              --output "$archive"
          fi
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 --check
          rm -rf "$sdk_root/flutter"
          mkdir -p "$sdk_root"
          unzip -q "$archive" -d "$sdk_root"
          echo "$sdk_root/flutter/bin" >> "$GITHUB_PATH"

      - name: Restore Dart package cache
        id: dart-pub-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev
            ~/.pub-cache/hosted-hashes/pub.dev
          key: ${{ runner.os }}-${{ runner.arch }}-dart-pub-${{ hashFiles('apps/mobile/tool/toolchain.json', 'apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}

      - name: Verify pinned Flutter package and generated bindings
        shell: pwsh
        env:
          GAINER_FLUTTER_SDK_ROOT: ${{ runner.temp }}/flutter-sdk/flutter
        run: ./scripts/Verify-Mobile.ps1

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
          IOS_APP_GROUP_ID: ${{ vars.IOS_APP_GROUP_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/gainer-signing.keychain-db"
          p12="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          widget_profile="$RUNNER_TEMP/widget-profile.mobileprovision"
          widget_profile_plist="$RUNNER_TEMP/widget-profile.plist"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf '%s' "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$widget_profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$profile" > "$profile_plist"
          security cms -D -i "$widget_profile" > "$widget_profile_plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          python3 - "$profile_plist" "$widget_profile_plist" "$APPLE_TEAM_ID" "$IOS_BUNDLE_ID" "$IOS_WIDGET_BUNDLE_ID" "$IOS_APP_GROUP_ID" <<'PY'
          import plistlib, sys
          app_path, widget_path, team, app_id, widget_id, group_id = sys.argv[1:]
          def read_profile(path):
              with open(path, "rb") as stream:
                  return plistlib.load(stream)
          app = read_profile(app_path)
          widget = read_profile(widget_path)
          def check(profile, bundle_id, label):
              entitlements = profile.get("Entitlements", {})
              app_identifier = entitlements.get("application-identifier", "")
              if team not in profile.get("TeamIdentifier", []):
                  raise SystemExit(f"{label} provisioning profile Team ID mismatch.")
              if app_identifier != f"{team}.{bundle_id}":
                  raise SystemExit(f"{label} provisioning profile bundle ID mismatch.")
              groups = entitlements.get("com.apple.security.application-groups", [])
              if not isinstance(groups, list) or group_id not in groups:
                  raise SystemExit(f"{label} provisioning profile does not include the configured App Group.")
          check(app, app_id, "App")
          check(widget, widget_id, "Widget")
          if app.get("Entitlements", {}).get("com.apple.developer.healthkit") is not True:
              raise SystemExit("App provisioning profile does not enable HealthKit.")
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$widget_profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$widget_profile_uuid.mobileprovision"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$profile_name</string>
              <key>$IOS_WIDGET_BUNDLE_ID</key><string>$widget_profile_name</string>
            </dict>
          </dict></plist>
          EOF

      - name: Build and export signed IPA
        shell: bash
        working-directory: apps/mobile
        env:
          GAINER_API_ORIGIN: ${{ vars.GAINER_API_ORIGIN || 'https://gainer.markfort.xyz' }}
          GAINER_TRUSTED_FRONTEND_ORIGIN: ${{ vars.GAINER_TRUSTED_FRONTEND_ORIGIN || 'https://gainer.markfort.xyz' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
          IOS_APP_GROUP_ID: ${{ vars.IOS_APP_GROUP_ID }}
          APP_MARKETING_VERSION: ${{ steps.build-version.outputs.marketing_version }}
          APP_BUILD_NUMBER: ${{ steps.build-version.outputs.build_number }}
        run: |
          set -euo pipefail
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget-profile.plist")"
          flutter build ios --config-only --release --no-codesign \
            --build-name="$APP_MARKETING_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define="GAINER_API_ORIGIN=$GAINER_API_ORIGIN" \
            --dart-define="GAINER_TRUSTED_FRONTEND_ORIGIN=$GAINER_TRUSTED_FRONTEND_ORIGIN"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gainer.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
            IOS_WIDGET_BUNDLE_ID="$IOS_WIDGET_BUNDLE_ID" \
            IOS_APP_GROUP_ID="$IOS_APP_GROUP_ID" \
            IOS_APP_PROFILE_NAME="$profile_name" \
            IOS_WIDGET_PROFILE_NAME="$widget_profile_name" \
            MARKETING_VERSION="$APP_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Gainer.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Validate and upload IPA to App Store Connect
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_MARKETING_VERSION: ${{ steps.build-version.outputs.marketing_version }}
          APP_BUILD_NUMBER: ${{ steps.build-version.outputs.build_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=( "$RUNNER_TEMP"/ipa/*.ipa )
          if [[ "${#ipa_files[@]}" -ne 1 ]]; then
            echo '::error::Expected exactly one exported IPA.'
            exit 1
          fi
          ipa="${ipa_files[0]}"
          extracted="$RUNNER_TEMP/ipa-identity-check"
          rm -rf "$extracted"
          mkdir -m 700 "$extracted"
          ditto -x -k "$ipa" "$extracted"
          app_path="$extracted/Payload/Runner.app"
          widget_path="$app_path/PlugIns/WidgetExtension.appex"
          [[ -d "$app_path" && -d "$widget_path" ]] || { echo '::error::Exported IPA is missing the expected app or widget extension.'; exit 1; }
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          widget_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_path/Info.plist")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          widget_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$widget_path/Info.plist")"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          widget_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget_path/Info.plist")"
          [[ "$app_id" == "$IOS_BUNDLE_ID" && "$widget_id" == "$IOS_WIDGET_BUNDLE_ID" ]] || { echo '::error::IPA bundle identifiers do not match the configured app and widget IDs.'; exit 1; }
          [[ "$app_version" == "$APP_MARKETING_VERSION" && "$widget_version" == "$APP_MARKETING_VERSION" ]] || { echo '::error::App and widget marketing versions do not match the configured release version.'; exit 1; }
          [[ "$app_build" == "$APP_BUILD_NUMBER" && "$widget_build" == "$APP_BUILD_NUMBER" ]] || { echo '::error::App and widget build numbers do not match the selected build number.'; exit 1; }
          codesign --verify --deep --strict "$app_path"
          codesign --verify --strict "$widget_path"
          app_signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          widget_signature="$(codesign -dv --verbose=4 "$widget_path" 2>&1)"
          [[ "$app_signature" == *"Identifier=$IOS_BUNDLE_ID"* && "$app_signature" == *"TeamIdentifier=$APPLE_TEAM_ID"* ]] || { echo '::error::IPA app signature identity does not match the configured app and team.'; exit 1; }
          [[ "$widget_signature" == *"Identifier=$IOS_WIDGET_BUNDLE_ID"* && "$widget_signature" == *"TeamIdentifier=$APPLE_TEAM_ID"* ]] || { echo '::error::IPA widget signature identity does not match the configured widget and team.'; exit 1; }

          key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          umask 077
          install -d -m 700 "$key_dir"
          trap 'rm -f "$key_file"; rmdir "$key_dir" 2>/dev/null || true' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          unset APP_STORE_CONNECT_PRIVATE_KEY
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          {
            echo '### TestFlight upload submitted'
            echo "- Bundle: \`$IOS_BUNDLE_ID\`"
            echo "- Version/build: \`$APP_MARKETING_VERSION ($APP_BUILD_NUMBER)\`"
            echo '- App Store Connect accepted the upload command; Apple processing and TestFlight availability are separate pending states.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach signed IPA for manual review
        if: ${{ !inputs.upload_testflight }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gainer-ios-signed-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ inputs.upload_testflight && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
        run: |
          set +e
          keychain="$RUNNER_TEMP/gainer-signing.keychain-db"
          security delete-keychain "$keychain" >/dev/null 2>&1
          profile_plist="$RUNNER_TEMP/profile.plist"
          widget_profile_plist="$RUNNER_TEMP/widget-profile.plist"
          if [[ -f "$profile_plist" ]]; then
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist" 2>/dev/null)"
            if [[ -n "$profile_uuid" ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          fi
          if [[ -f "$widget_profile_plist" ]]; then
            widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist" 2>/dev/null)"
            if [[ -n "$widget_profile_uuid" ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$widget_profile_uuid.mobileprovision"
            fi
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/widget-profile.mobileprovision" \
            "$RUNNER_TEMP/widget-profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/ipa-identity-check"
          if [[ "${APP_STORE_CONNECT_KEY_ID:-}" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            rmdir "$HOME/.appstoreconnect/private_keys" 2>/dev/null || true
          fi
          true
