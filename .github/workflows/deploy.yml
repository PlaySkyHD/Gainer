name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (must be reachable from main)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: Validate deployment revision
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate requested commit
        id: revision
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo '::error::Production deployments can only be dispatched from main.'
            exit 1
          fi
          if [[ "$REQUESTED_REF" == -* || -z "$REQUESTED_REF" ]]; then
            echo '::error::The requested deployment revision is invalid.'
            exit 1
          fi
          git fetch --no-tags origin main
          requested_sha="$(git rev-parse --verify --end-of-options "${REQUESTED_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$requested_sha" origin/main; then
            echo '::error::The requested commit is not reachable from origin/main.'
            exit 1
          fi
          printf 'sha=%s\n' "$requested_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.component }} image
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: deploy/Dockerfile.api
          - component: migrator
            dockerfile: deploy/Dockerfile.migrator
          - component: edge
            dockerfile: deploy/Dockerfile.edge
          - component: backup
            dockerfile: deploy/Dockerfile.backup

    steps:
      - name: Check out validated immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/playskyhd/gainer-${{ matrix.component }}:sha-${{ needs.resolve-ref.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Roll out to gainer.markfort.xyz
    needs: [resolve-ref, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://gainer.markfort.xyz
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out validated immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/gainer_deploy
          chmod 0600 ~/.ssh/gainer_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Upload immutable deployment files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          ssh -i ~/.ssh/gainer_deploy "$VPS_USER@$VPS_HOST" "install -d -m 0755 /srv/gainer/releases/$SHA/deploy/scripts"
          scp -i ~/.ssh/gainer_deploy deploy/compose.yaml "$VPS_USER@$VPS_HOST:/srv/gainer/releases/$SHA/deploy/compose.yaml"
          scp -i ~/.ssh/gainer_deploy deploy/scripts/deploy-release.sh "$VPS_USER@$VPS_HOST:/srv/gainer/releases/$SHA/deploy/scripts/deploy-release.sh"

      - name: Authenticate server to GHCR
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/gainer_deploy "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and verify health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: ssh -i ~/.ssh/gainer_deploy "$VPS_USER@$VPS_HOST" "bash /srv/gainer/releases/$SHA/deploy/scripts/deploy-release.sh '$SHA' 'ghcr.io/playskyhd'"

      - name: Verify public endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gainer.markfort.xyz/health/live
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://gainer.markfort.xyz/health/ready
