name: SonarQube App

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/sonar-app.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - apps/mobile/**
      - .github/workflows/sonar-app.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: App analysis
    # Fork and Dependabot pull requests do not receive repository secrets.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones reduce the relevance of the analysis

      - name: Install verified Flutter stable SDK
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("apps/mobile/tool/toolchain.json"))["flutter"]["version"])')"
          if [[ "$version" != '3.47.7' ]]; then
            echo "::error::apps/mobile/tool/toolchain.json pins Flutter $version; update the archive and SHA-256 in this workflow."
            exit 1
          fi
          archive="$RUNNER_TEMP/flutter_linux_${version}-stable.tar.xz"
          expected_sha256='af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230'
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${version}-stable.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/flutter-sdk"
          tar -xf "$archive" -C "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Cache Dart packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted/pub.dev
            ~/.pub-cache/hosted-hashes/pub.dev
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('apps/mobile/pubspec.yaml', 'apps/mobile/pubspec.lock') }}

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The analysis needs resolved dependencies and a coverage report.
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile

      # The runner defaults to UTC, where no clock change happens. Date logic
      # around daylight saving time only shows up in a zone that has it.
      - name: Run tests with coverage
        run: flutter test --coverage
        working-directory: apps/mobile
        env:
          TZ: Europe/Berlin

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: apps/mobile
          args: >
            -Dsonar.organization=playskyhd
            -Dsonar.projectKey=playskyhd_gainer_app
            -Dsonar.sources=lib,ios/Runner,ios/Shared,ios/WidgetExtension
            -Dsonar.tests=test,integration_test,ios/RunnerTests
            -Dsonar.exclusions=**/generated/**,**/*.g.dart,**/*.g.swift
            -Dsonar.coverage.exclusions=**/generated/**,**/*.g.dart,ios/**
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
