name: SonarQube Backend

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - contracts/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Gainer.slnx
      - .github/workflows/sonar-backend.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - src/**
      - tests/**
      - contracts/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Gainer.slnx
      - .github/workflows/sonar-backend.yml

permissions:
  contents: read
  pull-requests: read

env:
  OPENFOODFACTS_CONTACT_EMAIL: ci@example.invalid
  Parameters__openfoodfacts-contact-email: ci@example.invalid

concurrency:
  group: sonar-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Backend analysis
    # Fork and Dependabot pull requests do not receive repository secrets.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones reduce the relevance of the analysis

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.6.1

      - name: Install SonarQube Cloud scanner and coverage tool
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          dotnet tool install --global dotnet-coverage --version 18.12.0

      - name: Restore .NET dependencies
        run: dotnet restore Gainer.slnx --force-evaluate

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"playskyhd_gainer_backend"
          /o:"playskyhd"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions="**/Migrations/**,apps/**"
          /d:sonar.test.exclusions="apps/**"
          /d:sonar.coverage.exclusions="scripts/**"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build backend
        run: dotnet build Gainer.slnx --no-restore

      - name: Run backend tests with coverage
        run: >
          dotnet-coverage collect
          "dotnet test Gainer.slnx --no-restore --no-build"
          --output-format xml
          --output coverage.xml

      - name: End SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
