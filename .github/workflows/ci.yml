name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENFOODFACTS_CONTACT_EMAIL: ci@example.invalid
  Parameters__openfoodfacts-contact-email: ci@example.invalid

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.6.1

      - name: Restore .NET dependencies
        # The AppHost resolves DCP and the dashboard from the Aspire CLI bundle (AspireUseCliBundle),
        # so no OS-specific package is restored. Direct versions remain centrally pinned.
        run: dotnet restore Gainer.slnx --force-evaluate

      - name: Verify lock files are current
        # git status also catches lock files of new projects that were never committed.
        run: |
          stale="$(git status --porcelain -- '**/packages.lock.json')"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Lock-Dateien veraltet: dotnet restore Gainer.slnx --force-evaluate ausführen und committen"
            exit 1
          fi

      - name: Verify .NET formatting
        run: dotnet format Gainer.slnx --verify-no-changes --no-restore

      - name: Build backend
        run: dotnet build Gainer.slnx --no-restore

      - name: Run backend tests
        run: dotnet test Gainer.slnx --no-restore --no-build --logger trx --results-directory artifacts/test-results

      - name: Publish production API artifact
        run: dotnet publish src/Gainer.Api/Gainer.Api.csproj --no-restore --configuration Release --output artifacts/api

      - name: Reject secrets, fixtures, unapproved media, and RAG dependencies
        shell: pwsh
        run: ./scripts/Test-ReleaseSafety.ps1 -ArtifactPaths artifacts/api -CheckRepositoryPolicy

      - name: Publish Aspire Docker Compose model
        env:
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
        run: aspire publish --project src/Gainer.AppHost/Gainer.AppHost.csproj --output-path artifacts/aspire --non-interactive

      - name: Validate hardened VPS Compose
        shell: pwsh
        env:
          GAINER_EDGE_PORT: "8081"
          GAINER_SITE_ADDRESS: :80
          GAINER_SECRETS_DIR: /tmp/gainer-secrets
          AZURE_STORAGE_ACCOUNT_NAME: gainertest
          RESTIC_REPOSITORY: azure:gainer-backups:/test
        run: ./scripts/Test-DeploymentTopology.ps1

      - name: Build production container images
        env:
          GAINER_SECRETS_DIR: /tmp/gainer-secrets
          AZURE_STORAGE_ACCOUNT_NAME: gainertest
          RESTIC_REPOSITORY: azure:gainer-backups:/test
        run: docker compose -f deploy/compose.yaml --profile operations build api migrator edge backup

      - name: Verify non-root application images
        run: |
          for image in gainer-api:local gainer-migrator:local gainer-edge:local gainer-backup:local; do
            user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            case "$user" in
              ""|0|0:*|root|root:*) echo "::error::$image runs as root (USER='$user')"; exit 1 ;;
            esac
          done

      - name: Scan image metadata, history, and rendered Compose
        shell: pwsh
        env:
          GAINER_SECRETS_DIR: /tmp/gainer-secrets
          AZURE_STORAGE_ACCOUNT_NAME: gainertest
          RESTIC_REPOSITORY: azure:gainer-backups:/test
        run: |
          New-Item -ItemType Directory -Force artifacts/container-metadata | Out-Null
          docker image inspect gainer-api:local gainer-migrator:local gainer-edge:local gainer-backup:local | Out-File artifacts/container-metadata/inspect.json
          docker history --no-trunc gainer-api:local | Out-File artifacts/container-metadata/api-history.txt
          docker history --no-trunc gainer-migrator:local | Out-File artifacts/container-metadata/migrator-history.txt
          docker history --no-trunc gainer-edge:local | Out-File artifacts/container-metadata/edge-history.txt
          docker compose -f deploy/compose.yaml config | Out-File artifacts/container-metadata/compose.yaml
          ./scripts/Test-ReleaseSafety.ps1 -ArtifactPaths artifacts/container-metadata

      - name: Enforce NuGet license allowlist
        shell: pwsh
        run: ./scripts/Test-NuGetLicenses.ps1

      - name: Smoke-test the API edge proxy
        shell: bash
        run: |
          # Same runtime restrictions as deploy/compose.yaml.
          docker run --rm -d --name gainer-edge-smoke-test -e GAINER_SITE_ADDRESS=:80 -p 127.0.0.1:18081:80 \
            --read-only --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /data:uid=65532,gid=65532 --tmpfs /config:uid=65532,gid=65532 \
            gainer-edge:local
          trap 'docker stop gainer-edge-smoke-test' EXIT
          for _attempt in {1..20}; do
            curl --silent --output /dev/null http://127.0.0.1:18081/ && break
            sleep 1
          done
          headers="$(curl --silent --dump-header - --output /dev/null http://127.0.0.1:18081/)"
          echo "$headers"
          grep -q '^HTTP/1.1 404' <<<"$headers"
          grep -qi "^content-security-policy: default-src 'none'; frame-ancestors 'none'" <<<"$headers"
          association="$(curl --silent --fail http://127.0.0.1:18081/.well-known/apple-app-site-association)"
          echo "$association"
          python3 -c 'import json,sys; apps=json.loads(sys.argv[1])["webcredentials"]["apps"]; sys.exit(0 if apps == ["Q7GTYQ282F.xyz.markfort.gainer"] else 1)' "$association"

      - name: Reject generated contract drift
        run: git diff --exit-code -- contracts/openapi

      - name: Reject incompatible OpenAPI changes
        shell: pwsh
        env:
          OPENAPI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # pull_request.base.sha is frozen when the PR is opened or pushed and can predate
          # the current main. The checked-out merge ref already contains the current main as
          # its first parent, so compare against that (full history via fetch-depth: 0).
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              $parents = @((git rev-list --parents -n 1 HEAD) -split ' ')
              if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 3) { throw "HEAD is not the pull request merge commit." }
              $baseSha = $parents[1]
          }
          else {
              # push: github.event.before (all zeros for a new branch; the script then skips).
              $baseSha = $env:OPENAPI_PUSH_BEFORE_SHA
          }
          ./scripts/Test-OpenApiCompatibility.ps1 -BaseRef $baseSha

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
